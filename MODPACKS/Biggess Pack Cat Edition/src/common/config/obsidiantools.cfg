# Configuration file

general {
    # If mod author is an idiot, add custom wood Ore Dictionary names here
    S:OreDictNamesForEnderAxe=

    # Add Mod Ores Here - Use Ore Dictionary Names - I.E. oreCopper
    S:OreDictNamesForEnderPick=oreCopper, oreTin, oreLead, oreUranium
}


truefalse {
    # If you don't like ender bags, you can disable them
    B:EnderBagEnabled=true

    # If you think ender cane is OP, you may disable it
    B:EnderCaneEnabled=true

    # Disable to remove Ender Sand and Ender Dust
    B:EnderSandEnabled=true

    # Lets you disable ender tools if you think they're overpowered
    B:EnderToolsEnabled=true

    # Changes sticks to blaze rods in obsidian tool crafting
    B:HardmodeEnabled=false

    # Makes obsidian tools really OP. Don't use.
    B:SuperCheatMode=false
}


