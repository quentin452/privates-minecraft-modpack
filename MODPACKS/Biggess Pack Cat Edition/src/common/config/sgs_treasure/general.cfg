# Configuration file

##########################################################################################################
# 01-mod
#--------------------------------------------------------------------------------------------------------#
# General SGS Treasure! mod properties. This mod uses its own logging file(s), which can be configured as well.
##########################################################################################################

01-mod {
    # Enable the SGS Treasure! mod. [true|false] [default: true]
    B:enableTreasureMod=true

    # The directory where the logs should be stored. This is relative to the Minecraft install path. [default: mods/sgs_treasure/logs/]
    S:loggerFolder=mods/sgs_treasure/logs/

    # The logging level. Set to 'off' to disable logging. [trace|debug|info|warn|error|off] [default: info]
    S:loggerLevel=info

    # The size a log file can be before rolling over to a new file. [default: 1000K]
    S:loggerSize=1000K
}


##########################################################################################################
# 02-resources
#--------------------------------------------------------------------------------------------------------#
# Locations of all the files used by the mod. These are relative to the Minecraft install path.
##########################################################################################################

02-resources {
    S:booksFile=mods/sgs_treasure/books.json
    S:chamberMinesDirectory=mods/sgs_treasure/plans/chambers/mines
    S:chambersDirectory=mods/sgs_treasure/plans/chambers
    S:deepShipsDirectory=mods/sgs_treasure/plans/ships/deep
    S:forestBuildingsDirectory=mods/sgs_treasure/plans/buildings/forest
    S:forestWellsDirectory=mods/sgs_treasure/plans/wells/forest
    S:generalWellsChestDirectory=mods/sgs_treasure/plans/wells/general/chest
    S:generalWellsDirectory=mods/sgs_treasure/plans/wells/general
    S:hermitsDirectory=mods/sgs_treasure/plans/buildings/hermit
    S:shallowShipsDirectory=mods/sgs_treasure/plans/ships/shallow
    S:treasureChestConfigFile=mods/sgs_treasure/treasureChestConfig.json
}


##########################################################################################################
# 03-world-gen
#--------------------------------------------------------------------------------------------------------#
# Basic settings of rarity of generation/spawning. 'minChunksPerX' means that there will be n number of chunks (16x16 blocks) before an item (X) is attempted to spawn again.
##########################################################################################################

03-world-gen {
    B:enableChamberSpawners=true

    # The 'deep' maximum depth of blocks a ship can be under water. [range: 1 ~ 256, default: 45]
    I:maxDeepShipDepth=45

    #  [range: 1 ~ 256, default: 200]
    I:maxLabyrinthDepth=200

    # The 'shallow' maximum depth of blocks a ship can be under water. [range: 1 ~ 256, default: 9]
    I:maxShipDepth=9

    # Similar to minChunksPerChest [range: 1 ~ 32000, default: 800]
    I:minChunksPerBuilding=800

    # The minimun number of chunks between any two Treasure chest of any type. Note: not necessarily linear chunks. [range: 1 ~ 32000, default: 35]
    I:minChunksPerChest=35

    # Similar to minChunksPerChest. Note: Labyrinths can span long distances, so you should keep this number on the higher end (not below 500), else you could get labyrinths colliding with each other. [range: 1 ~ 32000, default: 500]
    I:minChunksPerLabyrinth=500

    # Similar to minChunksPerChest [range: 1 ~ 32000, default: 500]
    I:minChunksPerShip=500

    # Similar to minChunksPerChest [range: 1 ~ 32000, default: 900]
    I:minChunksPerWell=900

    # The 'deep' minimum depth of blocks a ship can be under water. [range: 0 ~ 256, default: 10]
    I:minDeepShipDepth=10

    #  [range: 1 ~ 256, default: 15]
    I:minLabyrinthDepth=15

    # The 'shallow' minimum depth of blocks a ship can be under water. Note: if ship biomes include land biomes, then the ship will appear on land (not underground.) [range: 0 ~ 256, default: 2]
    I:minShipDepth=2

    # The distance a player is from a OneTime Spawner that will trigger activation, ie. spawn. [range: 1 ~ 50, default: 7]
    I:oneTimeSpawnerActivatingRadius=7
}


##########################################################################################################
# 04-wooden-chest-gen
#--------------------------------------------------------------------------------------------------------#
# Wooden Chest generation properties.
##########################################################################################################

04-wooden-chest-gen {
    # The number of chunks between Wooden Chest generation attempts. ie. there will be at least 75 chunks between Wooden Generators (not linear chunks). However, another type of chest may generate before that number is reached. [range: 1 ~ 32000, default: 75]
    I:chunksPerWoodenChest=75

    # Enable Wooden Generators to generate. [true|false] [default: true]
    B:enableWoodenChest=true

    # Enable Wooden Generators to generate above ground. Ignored if enableWoodenChest=false. [true|false] [default: true]
    B:enableWoodenChestAboveGround=true

    # Enable Wooden Generators to generate below ground. Ignored if enableWoodenChest=false. [true|false] [default: true]
    B:enableWoodenChestBelowGround=true

    # Disallowable Biome Types for WoodenTreasure chests. Must match the Type identifer(s). [default: [plains], [ocean], [deep_ocean]]
    S:woodenChestAboveGroundBiomeBlackList <
        plains
        ocean
        deep_ocean
     >

    # Allowable Biome Types for Wooden Treasure chests. Must match the Type identifer(s). [default: ]
    S:woodenChestAboveGroundBiomeWhiteList <
     >

    # Disallowable Biome Types for below ground WoodenTreasure chests. Must match the Type identifer(s). [default: [ocean]]
    S:woodenChestBelowGroundBiomeBlackList <
        ocean
     >

    # Allowable Biome Types for above ground Wooden Treasure chests. Must match the Type identifer(s). [default: ]
    S:woodenChestBelowGroundBiomeWhiteList <
     >

    # The percent chance that a Wooden Chest will successfully generate when the generation is next attempted. ie. Every X chunks, an attempt will be made to generate a  Wooden Chest. There is a Y percent change that this will be successfull. [range: 0 ~ 100, default: 45]
    I:woodenChestGenProbability=45
}


##########################################################################################################
# 05-locked-wooden-chest-gen
#--------------------------------------------------------------------------------------------------------#
# Locked Wooden Chest generation properties.  Similar to Wooden Chest properties.
##########################################################################################################

05-locked-wooden-chest-gen {
    #  [range: 1 ~ 32000, default: 75]
    I:chunksPerLockedWoodenChest=75
    B:enableLockedWoodenChest=true
    B:enableLockedWoodenChestAboveGround=true
    B:enableLockedWoodenChestBelowGround=true

    # Disallowable Biome Types for above ground Locked Wooden Treasure chests. Must match the Type identifer(s). [default: [plains], [ocean]]
    S:lockedWoodenChestAboveGroundBiomeBlackList <
        plains
        ocean
     >

    # Allowable Biome Types for above ground Locked Wooden Treasure chests. Must match the Type identifer(s). [default: ]
    S:lockedWoodenChestAboveGroundBiomeWhiteList <
     >

    # Disallowable Biome Types for below ground Locked Wooden Treasure chests. Must match the Type identifer(s). [default: [ocean]]
    S:lockedWoodenChestBelowGroundBiomeBlackList <
        ocean
     >

    # Allowable Biome Types for below ground Locked Wooden Treasure chests. Must match the Type identifer(s). [default: ]
    S:lockedWoodenChestBelowGroundBiomeWhiteList <
     >

    #  [range: 0 ~ 100, default: 35]
    I:lockedWoodenChestGenProbability=35
}


