    I:chunksPerCaveLabyrinth=1500

    # Similar to chunksPerXXXChest. Note: Labyrinths can span long distances, so you should keep this number on the higher end (not below 500), else you could get labyrinths colliding with each other. [range: 1 ~ 32000, default: 1700]
    I:chunksPerDungeonLabyrinth=1700

    # Chests that can be found in an easy dungeon (1 level). [default: [locked_wooden_chest]]
    S:dungeonLabyrinthChestSet1 <
        locked_wooden_chest
     >

    # Chests that can be found in an easier dungeon (2 levels). [default: [locked_wooden_chest], [iron_bound_chest]]
