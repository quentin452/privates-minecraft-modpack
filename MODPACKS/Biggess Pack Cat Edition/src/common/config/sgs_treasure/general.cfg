##########################################################################################################
# 15-labyrinth-gen
#--------------------------------------------------------------------------------------------------------#
# Labyrinth-enabled generation properties. Similar to Wooden Chest properties.
##########################################################################################################

15-labyrinth-gen {
    # Chests that can be found in an easy cave (1 level). [default: [wooden_chest], [locked_wooden_chest]]
    S:caveLabyrinthChestSet1 <
        wooden_chest
        locked_wooden_chest
     >

    # Chests that can be found in an easier cave (2 levels). [default: [wooden_chest], [locked_wooden_chest], [iron_bound_chest]]
    S:caveLabyrinthChestSet2 <
        wooden_chest
        locked_wooden_chest
        iron_bound_chest
     >

    # Chests that can be found in an medium cave (3 levels). [default: [iron_bound_chest], [pirate_chest]]
    S:caveLabyrinthChestSet3 <
        iron_bound_chest
        pirate_chest
     >

    # Chests that can be found in an harder cave (>3 levels). [default: [pirate_chest], [dread_pirate_chest], [obsidian_chest]]
    S:caveLabyrinthChestSet4 <
        pirate_chest
        dread_pirate_chest
        obsidian_chest
     >

    #  [range: 0 ~ 100, default: 100]
    I:caveLabyrinthGenProbability=100

    #  [range: 1 ~ 15, default: 3]
    I:caveLabyrinthTreasureRoomSpawnerMaxSpawns=3

    #  [range: 1 ~ 5, default: 1]
    I:caveLabyrinthTreasureRoomSpawnerMinSpawns=1

    #  [default: [Zombie], [Skeleton], [Spider]]
    S:caveLabyrinthTreasureRoomSpawnerMobs <
        Zombie
        Skeleton
        Spider
     >

    #  [default: [25], [35], [1]]
    S:caveStrata1 <
        25
        35
        1
     >

    #  [default: [35], [45], [2]]
    S:caveStrata2 <
        35
        45
        2
     >

    #  [default: [45], [65], [3]]
    S:caveStrata3 <
        45
        65
        3
     >

