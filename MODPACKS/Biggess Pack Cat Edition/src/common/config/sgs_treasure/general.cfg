    I:minCavePassageLength=3

    # Minimum number of sections per level.  A section is either a passage or a room. [range: 1 ~ 15, default: 2]
    I:minCaveSectionsPerLevel=2

    # Minimum number of length (in 'slices') of a dungeon passage. [range: 1 ~ 15, default: 3]
    I:minDungeonPassageLength=3

    # Minimum number of sections per level.  A section is either a passage or a room. [range: 1 ~ 15, default: 2]
    I:minDungeonSectionsPerLevel=2
}


##########################################################################################################
# 16-hermit-gen
#--------------------------------------------------------------------------------------------------------#
# Hermit generation properties. Similar to Wooden Chest properties.
##########################################################################################################

16-hermit-gen {
    B:enableHermitSpawners=false
    B:enableHermits=true

    # Disallowable Biome Types for Hermits. Must match the Type identifer(s). [default: [ocean]]
    S:hermitBiomeBlackList <
        ocean
     >

    # Allowable Biome Types for Hermits. Must match the Type identifer(s). [default: ]
    S:hermitBiomeWhiteList <
     >

    # Dialogs to use when Hermit does not wish to trade. [default: [I am tired. Come back later.], [Go away. I've told you too much already.], [Maybe another time, I'm a very busy man.], [Do you think gottsch sits around all day creating dialogs?]]
    S:hermitBusyDialog <
        I am tired. Come back later.
        Go away. I've told you too much already.
        Maybe another time, I'm a very busy man.
        Do you think gottsch sits around all day creating dialogs?
     >

    # The number of ticks that a Hermit rests inbetween trades. [range: 0 ~ 24000, default: 6000]
    I:hermitGenProbability=35

    # Dialogs to use when Hermit does not have any data to give player. [default: [I'm sorry, I have no information for you at this time.  Come again after you have explored some more.], [I'm don't have any secrets to share with you right now.], [No news to share with you, sorry.]]
    S:hermitNoDataDialog <
        I'm sorry, I have no information for you at this time.  Come again after you have explored some more.
        I'm don't have any secrets to share with you right now.
        No news to share with you, sorry.
     >

    # Dialogs to use when Hermit rejects an item for trade. [default: [Sorry, I have no interest in that.], [Maybe something with gold or silver in it would help me to remember...], [I do fancy jewels as well. Come back when you have something of value.], [I may be a hermit, but I don't accept useless junk.]]
    S:hermitRejectDialog <
        Sorry, I have no interest in that.
        Maybe something with gold or silver in it would help me to remember...
        I do fancy jewels as well. Come back when you have something of value.
        I may be a hermit, but I don't accept useless junk.
     >

    # Dialogs to use when successfully traded with a Hermit. [default: [There is a %s not far away. It is about %s meters %s and %s meters %s from here.]]
    S:hermitSuccessDialog <
        There is a %s not far away. It is about %s meters %s and %s meters %s from here.
     >

