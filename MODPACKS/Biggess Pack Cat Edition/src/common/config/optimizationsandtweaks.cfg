# Configuration file

general {
    # Enabling Block Name Debugger for getPendingBlockUpdates from WorldServer Class?.
    # [default: false]
    B:enablegetPendingBlockUpdatesDebugger=false

    # EXPERIMENTAL mod-agnostic worldgen cascade net. During chunk populate, skips neighbour
    # notifications that reach into a not-yet-generated chunk (the weak-change/comparator fan-out
    # and neighbour block-updates), which is what forces an out-of-order neighbour to generate
    # mid-populate (cascading worldgen lag). Content-neutral (worldgen needs no block-update
    # physics), and unlike a depth-cap it never cancels the generation a decoration depends on.
    # Complements the per-mod MixinFixCascading* fixes; catches the tile-entity-block residual
    # they cannot. OFF by default: validate world identity (fingerprint A/B) before enabling.
    # [default: false]
    B:enableWorldgenCascadeNet=true

    # Cache Thaumcraft inferred aspects to disk (config/optimizationsandtweaks/thaumcraft-aspect-cache.txt). First boot generates it (~unchanged), later boots skip the ~40s recipe-graph inference. Auto-invalidated when the modlist or MineTweaker scripts change.
    # [default: true]
    B:enableThaumcraftAspectCache=true

    # Choose the number of processor/CPU of your computer to fix potential issues.
    # [range: 1 ~ 64, default: 6]
    I:numberofcpus=6

    # Enable Rust-powered pathfinding optimization for PathFinder (significant performance improvement) (async)
    # [default: true]
    B:enablePathFindingOptimizations=true

    # Enable optimizationsandtweaks Rust profiler
    # [default: false]
    B:enableRustProfiler=false

    # Enable optimizationsandtweaks Rust panic guards
    # [default: true]
    B:enableRustPanicGuard=true

    # Auto-confirm future FML queries after first confirmation
    # [default: true]
    B:enableFMLAutoConfirmAfterFirstConfirmation=true

    # Tidy Chunk Backport feature(EntityItem remover at first chunk generation to reduce tps lags)(require MixinWorld)
    # [default: true]
    B:enableTidyChunkBackport=true

    # Tidy Chunk Backport Number of ticks post chunk generation to check for EntityItems , 20 tick = 1 seconde
    # [range: 0 ~ 1000, default: 50]
    I:TidyChunkBackportPostTick=80

    # Tidy Chunk Backport debugger
    # [default: false]
    B:enableTidyChunkBackportDebugger=false

    # EntityItem Spawning debugger
    # [default: false]
    B:enableEntityItemSpawningDebugger=false

    # UnunquadiumLand mod Dimensionid(Require enableMixinmcreator_ununquadiumLand)
    # [range: 0 ~ 65536, default: 3]
    I:LandDimensionID=3
}


