    # Whether or not to ores render on stone texture. [default: false]
    B:oreRenderOverlay=false

    # Whether or not to Mining Pickaxe fake to the base pickaxe. [default: false]
    B:fakeMiningPickaxe=false

    # Whether or not to Lumbering Axe fake to the base axe. [default: false]
    B:fakeLumberingAxe=false

    # Whether or not to Digging Shovel fake to the base shovel. [default: false]
    B:fakeDiggingShovel=false

    # Whether or not to Farming Hoe fake to the base hoe. [default: false]
    B:fakeFarmingHoe=false

    # Specify the milliseconds for mining mode simple information display time. [range: 0 ~ 2147483647, default: 2200]
    I:modeDisplayTime=2200

    # Specify the break block count of quick breaking. If specify 0, that will be unlimited. [range: 0 ~ 1000, default: 100]
    # Note: If multiplayer, server-side only.
    I:quickBreakLimit=100

    # Whether or not to cache portal coordinates. [default: true]
    # Note: If multiplayer, server-side only.
    B:portalCache=true

    # Whether or not to disable cavenium tools. [default: false]
    # Note: If multiplayer, server-side only.
    B:disableCaveniumTools=false

    # Whether or not to disable infitite tools. [default: false]
    # Note: If multiplayer, server-side only.
    B:disableInfititeTools=false

    # Whether or not to disable infitite armors. [default: false]
    # Note: If multiplayer, server-side only.
    B:disableInfititeArmors=false
}


options {
    # If go to the cave dimensions, Cannot go back from the cave dimensions. [default: false]
    # Note: If multiplayer, server-side only.
    B:hardcore=false

    # Transfer to the cave dimension when join to world for the first time. [range: 0 ~ 4, default: 0]
